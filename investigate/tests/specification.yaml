    {
      "id": "F16-investigate-skill",
      "title": "Locate conflict without deciding authority",
      "mode": "inline",
      "critical": true,
      "covers": [
        "../../evals/requirement-fidelity/README.md#f16",
        "../../evals/requirement-fidelity/README.md#f17"
      ],
      "env": {
        "workspace": "fixture:../../evals/requirement-fidelity/fixtures/source-conflict"
      },
      "turns": [
        "Locate what SPEC-A.md, SPEC-B.md, definitions.md, implementation.mjs and evidence.txt establish about admission. Find authoritative-source candidates, exact definition, observed code and evidence gaps. Neither source has declared precedence. Do not decide which should win or provide a compliance verdict; return a cited factual report."
      ],
      "checklist": [
        "Cite source paths/locations for both conflicting limits, the Count definition, implementation behavior and the missing candidate-bound evidence.",
        "Distinguish source requirement from code behavior and historical measurement; do not choose source precedence or assert compliance from the implementation.",
        "No writes, shell, dispatch, design proposal or review verdict; caller may persist the factual report, investigator does not."
      ],
      "assert": {
        "trace": {
          "require_calls": [
            {
              "tool": "read",
              "args": {
                "path": {
                  "matches": "(^|/)SPEC-A\\.md$"
                }
              }
            },
            {
              "tool": "read",
              "args": {
                "path": {
                  "matches": "(^|/)SPEC-B\\.md$"
                }
              }
            },
            {
              "tool": "read",
              "args": {
                "path": {
                  "matches": "(^|/)definitions\\.md$"
                }
              }
            },
            {
              "tool": "read",
              "args": {
                "path": {
                  "matches": "(^|/)implementation\\.mjs$"
                }
              }
            },
            {
              "tool": "read",
              "args": {
                "path": {
                  "matches": "(^|/)evidence\\.txt$"
                }
              }
            }
          ],
          "unchanged_paths": [
            "**"
          ],
          "forbid_calls": [
            "bash",
            "edit",
            "write"
          ]
        }
      }
    },
