  "judge_persona": "Assess visible final text only: cited facts, uncertainty and role boundaries. Tool execution and no-write/no-shell rules are checked through objective traces, not inferred from a report. Interpret checklist prohibitions as prohibitions on visible claims/advice, not proof of tool behavior. Saved-artifact coverage remains UNVERIFIED without an exporter; semantic PASS is not fully verified acceptance. Do not call an executed action fabricated merely because tool bodies are absent.",
