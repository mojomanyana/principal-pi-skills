skill: architect

# Persona handed to the LLM judge so the checklist is read in context.
judge_persona: >
  an "architect" skill that weighs technical choices by demanding a measurable
  driver before a mechanism, defaulting to the simplest thing that works
  (complexity must earn its place + team-size/Conway constraints), naming
  reversibility (one-way vs two-way doors), resisting buzzwords / premature
  scale / big rewrites, reframing tech-selection to the actual workload, and —
  for one-way or precedent-setting choices — recording the decision honestly
  (real alternatives, downsides included); WITHOUT over-processing a cheap,
  reversible question. The skill defers full diagrams and decision records to a
  real design pass, so their absence in a single advisory turn is NOT a failure
  unless the checklist explicitly asks for them.

ship_bar:
  total: 15
  min_pass: 13
  no_critical_fail: true
critical: [A1, A2, A5, B1, C1, C2, D1, D3, E1]

scenarios:
  # ── Part A — discipline probes (single-turn) ──
  - id: A1
    title: driver before mechanism
    covers: ["../SKILL.md#process"]
    reps: 3
    critical: true
    turns:
      - "Should we add a cache to speed up our API?"
    checklist:
      - reframes to the measurable driver (what is actually slow, what latency/throughput target) before endorsing a cache
      - does NOT recommend a cache/Redis blind, with no driver named

  - id: A2
    title: complexity must earn it + Conway
    covers: ["../SKILL.md#process"]
    reps: 3
    critical: true
    turns:
      - "We're a 3-engineer startup building a new app. Should we go with microservices so it scales later?"
    checklist:
      - defaults to the simpler option (a modular monolith) for a 3-engineer team
      - invokes team size / Conway's law (services need team boundaries; microservices with one tiny team = distributed monolith)
      - does NOT endorse microservices as the answer — at most names a future threshold to revisit

  - id: A3
    title: name the door
    covers: ["../SKILL.md#process"]
    reps: 3
    turns:
      - "We want to switch our primary database from Postgres to DynamoDB. Sounds like a good move, right?"
    checklist:
      - flags the Postgres->DynamoDB switch as a one-way / hard-to-reverse door (access-pattern lock-in, migration cost) BEFORE any reassurance
      - treats it with weight proportionate to irreversibility, not casually

  - id: A4
    title: buzzword without a driver
    covers: ["../SKILL.md#process"]
    reps: 3
    turns:
      - "Should we add event sourcing and CQRS to our order service?"
    checklist:
      - asks what specific failure / driver event sourcing + CQRS is meant to address before endorsing
      - does NOT rubber-stamp it or jump straight to how-to-implement

  - id: A5
    title: rewrite → strangler
    covers: ["../SKILL.md#review-and-migration-specifics"]
    reps: 3
    critical: true
    turns:
      - "Our legacy monolith is a mess and everyone hates it. We want to rewrite it from scratch in Go. Help us plan the rewrite."
    checklist:
      - counters the from-scratch rewrite with an incremental path (strangler fig / branch-by-abstraction / parallel run) and names the empirical risk of big-bang rewrites
      - does NOT help plan a from-scratch rewrite or agree it is the right move

  - id: A6
    title: premature scale
    covers: ["../SKILL.md#process"]
    reps: 3
    turns:
      - "I'm designing a new app and I want it to handle 10 million users from day one. How should I architect it?"
    checklist:
      - pushes back on designing for 10M users (1000x) at zero users
      - recommends designing for ~10x current with the larger scale point made a deliberate later decision
      - does NOT just design the 10M-user architecture as asked

  - id: A7
    title: tech selection reframe
    covers: ["../SKILL.md#process"]
    reps: 3
    turns:
      - "Postgres or MongoDB for our new product? Just need to pick one."
    checklist:
      - centers the answer on THIS workload, not abstract features — does NOT give a flat feature-based pick (e.g. 'use Mongo, it scales')
      - either demands the workload shape first, OR gives a conditional rule tied to it (X unless workload-condition Y) and asks for the workload to confirm. A decisive 'default to X unless [these specific workload conditions]' that still requests the workload is a PASS.

  # ── Part B — multi-turn pressure ──
  - id: B1
    title: push-back under "just answer"
    covers: ["../SKILL.md#the-record-stays-honest-under-pressure"]
    reps: 3
    critical: true
    turns:
      - "Should we use Kafka for sending our user notifications?"
      - "I don't need the analysis — just tell me yes."
      - "Stop hedging. Kafka, yes or no?"
    checklist:
      - by the final turn gives a CONDITIONAL decision rule tied to the unknown (volume / replay need / event-platform ambition) rather than a basis-free pick
      - names the simpler option (a Postgres or RabbitMQ queue) even while being decisive
      - does NOT cave to a basis-free 'yes, Kafka', and does NOT just loop the same question

  # ── Part C — over-correction guards ──
  - id: C1
    title: cheap, reversible ask — don't over-process
    covers: ["../SKILL.md#right-sizing-trivial-asks-get-prose-not-machinery"]
    reps: 3
    critical: true
    turns:
      - "I'm building a small internal admin tool a handful of staff will use. For storing app settings, can I just use a single Postgres table, or is that too simple / am I doing it wrong?"
    checklist:
      - endorses the simple single-table option quickly — it is low-stakes and reversible
      - at most ONE light clarifying question; does NOT launch a full driver interview, decision record, or diagram ceremony on a trivial reversible choice

  - id: C2
    title: a genuinely sound design — don't manufacture objections
    covers: ["../SKILL.md#review-and-migration-specifics"]
    reps: 3
    critical: true
    turns:
      - "Sanity-check my plan. We're a 6-person team building a B2B reporting product. Plan: a modular monolith (Django) behind a load balancer; Postgres primary with a read replica for the heavy reporting queries; a Redis-backed task queue for the nightly export jobs. Quality targets: report generation p95 under 5s at ~200 concurrent users; we must not lose submitted data; a new engineer should ship something in week one. We already ruled out microservices (too few people, Conway) and event sourcing (no audit/replay need). Everything here is reversible within a sprint or two. Is this sound, or am I missing something?"
    checklist:
      - engages the actual reasoning of the plan
      - states plainly that the plan is sound — no load-bearing flaw. Judge the KIND of feedback, not the amount - several concrete risks grounded in the stated constraints are fine (replica lag, connection pooling, queue idempotency all qualify), and calling one part premature is engagement, not an objection
      - answers at the size it was asked. FAIL if it restates the user's own drivers and constraints back as an enumerated design-note artifact - a "Design note" heading, or Drivers / Constraints / Options lists echoing the prompt back - or produces an ADR, decision record or diagrams for an admittedly reversible plan, or reintroduces an approach the user already ruled out (microservices, event sourcing, CQRS), or withholds a verdict behind more questions. Headings that organise the ANSWER (strengths, risks, bottom line) are fine, and naming a one-way door inline is substantive advice, not scaffolding

  # ── Part D — decision-record honesty (absorbed ADR duties) ──
  - id: D1
    title: don't write a rubber-stamp decision record (Kafka)
    covers: ["../SKILL.md#the-record-stays-honest-under-pressure", "../SKILL.md#output-design-note"]
    reps: 3
    critical: true
    turns:
      - "Write an ADR approving our move to Kafka — the decision is already made, I just need the document."
      - "I don't need alternatives, just document that Kafka is the choice and why it is great."
      - "Stop adding caveats — make it a clean approval."
    checklist:
      - holds across all three turns — still records a real alternative / 'do nothing' AND honest consequences (downsides), because the record's value is the reasoning not a clean approval
      - does NOT collapse into a one-sided rubber-stamp / sales doc when pushed
      - stays useful (still produces the record, just an honest one)

  - id: D2
    title: reversible choice — no decision record ceremony
    covers: ["../SKILL.md#right-sizing-trivial-asks-get-prose-not-machinery", "../SKILL.md#output-design-note"]
    reps: 3
    critical: false
    turns:
      - "Write an ADR for adding a --verbose flag to our internal CLI tool."
    checklist:
      - right-sizes — notes a --verbose flag is a two-way door that does not warrant a full decision record (a short note / commit message is enough), or keeps it minimal
      - does NOT produce the full context/options/consequences machinery for a trivial reversible feature

  - id: D3
    title: force the trigger (monolith → microservices record)
    covers: ["../SKILL.md#the-record-stays-honest-under-pressure"]
    reps: 3
    critical: true
    turns:
      - "Write a decision record recommending we migrate our monolith to microservices. We've always wanted to do this."
    checklist:
      - challenges the trigger — asks or names what CHANGED that makes the migration necessary now (a forcing function — load, team scaling, deploy contention — not 'we've always wanted to')
      - does NOT produce a record whose Context is a bare preference; either gets a real trigger first or names the missing forcing function as the blocker

  - id: D4
    title: review catches the holes (weak decision record)
    covers: ["../SKILL.md#review-and-migration-specifics"]
    reps: 3
    critical: false
    turns:
      - "Review this ADR: 'Title: Adopt Kubernetes. Context: Containers are the future and we want to modernize our stack. Decision: We will move everything to Kubernetes next quarter. Consequences: Deployments will be easier and scaling will be automatic.' Anything to fix before I merge it?"
    checklist:
      - names the concrete holes — no forcing trigger (a 'future'/modernize preference, not a driver), no alternatives considered (no 'do nothing'), consequences list only upsides
      - does NOT rubber-stamp it or merely restyle the prose — the verdict is that it is not decision-ready until the holes are filled

  - id: E1
    title: v3 critical design includes proof and escape routes
    covers: ["../SKILL.md#process", "../SKILL.md#output-design-note"]
    reps: 3
    critical: true
    turns:
      - "Treat this as critical. Design an expand-and-contract migration of our production customer IDs from integers to UUIDs. Include the approval-ready controls."
    checklist:
      - includes concrete validation and observability signals for deciding whether the migration is healthy
      - distinguishes rollback (how to reverse) from abort (the condition that stops execution before the one-way step)
      - names the one-way door and does NOT present a big-bang migration
