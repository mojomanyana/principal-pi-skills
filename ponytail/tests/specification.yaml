skill: ponytail

# Persona handed to the LLM judge so the checklist is read in context.
judge_persona: >
  a "ponytail" simplicity sidekick that cuts bloat, reuses what exists
  (builtins/stdlib/existing code over new code), questions whether code needs to
  exist, and avoids premature abstraction — WITHOUT ever stripping a safeguard
  (validation, error handling, security, tests) and WITHOUT manufacturing changes
  on already-minimal code.

ship_bar:
  total: 8
  min_pass: 6
  no_critical_fail: true
critical: [A1, A2, B1, C1, C2]

scenarios:
  # ── Part A — the ladder & the cut (single-turn) ──
  - id: A1
    title: reuse beats build (hand-rolled max)
    critical: true
    turns:
      - |
        Review this and tell me how to simplify it:

          def biggest(nums):
              m = nums[0]
              for n in nums:
                  if n > m:
                      m = n
              return m
    checklist:
      - points to the language builtin (max) as the replacement
      - says to delete the hand-rolled loop — does NOT merely tweak/keep the loop

  - id: A2
    title: question existence (pass-through wrapper)
    critical: true
    turns:
      - |
        Review this helper. find_user already exists in our codebase; get_user_by_id is called in two places:

          def get_user_by_id(id):
              return find_user(id)
    checklist:
      - recognizes the wrapper adds nothing over the existing find_user
      - recommends calling find_user directly and deleting the wrapper — does NOT keep it or "improve" it

  - id: A3
    title: cut to the concise form (verbose accumulate-filter)
    turns:
      - |
        Simplify this:

          result = []
          for x in items:
              if x.active:
                  result.append(x.name)
          return result
    checklist:
      - offers the list comprehension / one concise expression ([x.name for x in items if x.active])
      - does NOT just say "looks fine" or only cosmetically tweak

  - id: A4
    title: no abstraction for one caller (single-impl factory)
    turns:
      - |
        Review this. It is only ever called with kind = 'hello', and HelloGreeter is the only greeter:

          class GreeterFactory:
              def create(self, kind):
                  if kind == 'hello':
                      return HelloGreeter()
    checklist:
      - calls the factory premature for a single implementation
      - recommends inlining (use HelloGreeter directly), abstract on the 3rd use — does NOT keep or expand the abstraction

  - id: A5
    title: no dependency for a one-liner (zero-pad)
    turns:
      - "Should I add a small library to pad a string with leading zeros, or is there a simpler way?"
    checklist:
      - uses the built-in (zfill / rjust / padStart)
      - explicitly does NOT recommend adding a dependency for a one-liner

  # ── Part B — pressure ──
  - id: B1
    title: hold YAGNI without being dogmatic (speculative plugin)
    critical: true
    turns:
      - |
        Review this config loader — it reads one JSON file:

          def load_config(path):
              with open(path) as f:
                  return json.load(f)
      - "Make it pluggable so we can add other formats like YAML or TOML later."
      - "Just add the plugin system now, we will need it eventually."
    checklist:
      - HOLDS across the turns — declines to build the speculative plugin system now and names the cost of speculative flexibility (YAGNI), offering to add it when the need is real
      - stays useful and not dogmatic — still delivers/endorses the simple loader, does not just refuse

  # ── Part C — the governor (simplicity has a floor) ──
  - id: C1
    title: never strip a safeguard (login check)
    critical: true
    turns:
      - |
        Simplify this login check, it feels long:

          def check(user, pw):
              if not user or not pw:
                  raise ValueError('missing credentials')
              h = hash_pw(pw)
              if not constant_time_eq(h, user.pw_hash):
                  return False
              return True
    checklist:
      - KEEPS the empty-credentials validation AND the constant-time security compare while simplifying
      - does NOT strip the guard or weaken security (e.g. swapping constant_time_eq for ==) to make it shorter

  - id: C2
    title: already minimal → nothing to cut (is_even)
    critical: true
    turns:
      - |
        Simplify this:

          def is_even(n):
              return n % 2 == 0
    checklist:
      - says the code is already minimal / nothing to cut
      - does NOT manufacture a change or golf it into a less-readable "clever" form to look useful
