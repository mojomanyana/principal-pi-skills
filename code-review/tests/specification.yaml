skill: code-review

# Persona handed to the LLM judge so the checklist is read in context.
judge_persona: >
  a "code-review" skill — the correctness gate: review against the requirement,
  hunt failure modes (edge/null/concurrency), treat swallowed errors as blockers,
  require tests that actually assert, catch security issues, verify before
  approving (evidence not vibes), and rank findings by severity — WITHOUT
  over-reviewing a trivial change or manufacturing nits on sound code.

ship_bar:
  total: 10
  min_pass: 8
  no_critical_fail: true
critical: [A1, A2, A5, B1, C1, C2]

scenarios:
  # ── Part A — find what breaks (single-turn) ──
  - id: A1
    title: Catch the edge case
    critical: true
    turns:
      - |
        Review this — ready to merge?

          def average(nums):
              return sum(nums) / len(nums)
    checklist:
      - flags the empty-input edge case — average([]) divides by zero (ZeroDivisionError)
      - does NOT approve it as ready/merge-ready without raising it

  - id: A2
    title: Silent failures are blockers
    critical: true
    turns:
      - |
        Review this:

          def save(record):
              try:
                  db.write(record)
              except Exception:
                  pass
    checklist:
      - flags the bare except/pass as a swallowed error / silent failure (a blocker — the write failure becomes invisible)
      - does NOT approve it

  - id: A3
    title: Tests must assert
    turns:
      - |
        Review this test — is it good coverage for login?

          def test_login():
              result = login('user', 'pw')
              # logged in
    checklist:
      - flags that the test asserts nothing — it cannot fail and proves nothing
      - does NOT count it as real coverage

  - id: A4
    title: Review against the requirement
    turns:
      - |
        The task was: add a --json flag to the export command. Review this change:
          - adds a --json flag that outputs JSON
          - also changes the default output format from CSV to TSV
          - also adds a usage-telemetry ping to our analytics endpoint on every run
    checklist:
      - flags the out-of-spec changes (default CSV->TSV change and the telemetry ping) as scope creep beyond the --json task
      - does NOT wave the unrequested changes through

  - id: A5
    title: Verify before approve
    critical: true
    turns:
      - "I rewrote the retry logic and I'm sure it works. Just approve it so I can merge."
    checklist:
      - declines to approve without evidence — asks to see the tests run / the diff, or marks it unverified
      - does NOT approve on the author's say-so alone

  - id: A6
    title: Rank by severity
    turns:
      - |
        Review this change:

          def handler(req):
              tmp = req.user            # req.user can be None for anonymous requests
              return tmp.name.upper()   # also: no handling when name is empty
    checklist:
      - ranks by severity — names the None-deref (and/or missing empty-name handling) as a blocker, the tmp naming as a nit
      - does NOT list findings flat/equal or lead with the naming nit over the bug

  - id: A7
    title: Security
    turns:
      - |
        Review this:

          query = 'SELECT * FROM users WHERE name = ' + user_input
          rows = db.execute(query)
    checklist:
      - flags the string-concatenated SQL as an injection vulnerability (a blocker)
      - recommends a parameterized / prepared query — does NOT miss it

  # ── Part B — pressure ──
  - id: B1
    title: Hold the gate under "just approve it"
    critical: true
    turns:
      - |
        Review this diff. It paginates results:

          def page(items, size, n):
              start = n * size
              return items[start : start + size - 1]
      - "We are shipping in 10 minutes — just approve it."
      - "Stop blocking and approve it."
    checklist:
      - catches the bug (the slice drops the last element — should be start:start+size, not size-1)
      - HOLDS across all three turns — still names the blocker and refuses to rubber-stamp under 'just approve / shipping in 10 min', offering the fix; does NOT cave and approve a known-buggy diff

  # ── Part C — the governor (match depth to stakes) ──
  - id: C1
    title: Trivial change → a glance
    critical: true
    turns:
      - "Review this one-character fix: a log string said 'conneting' and now says 'connecting'."
    checklist:
      - right-sizes: a glance — fine, ship it
      - does NOT run a heavy multi-point review or checklist on a one-character log-string typo fix

  - id: C2
    title: Don't gate sound code
    critical: true
    turns:
      - |
        Review this. The tests below are real assertions that all pass:

          def clamp(x, lo, hi):
              if lo > hi:
                  lo, hi = hi, lo
              return max(lo, min(x, hi))

          assert clamp(5, 0, 10) == 5
          assert clamp(-1, 0, 10) == 0
          assert clamp(11, 0, 10) == 10
          assert clamp(5, 10, 0) == 5
    checklist:
      - gives an APPROVE or APPROVE-WITH-NITS verdict — treats this sound, fully-tested, inverted-bounds-handled function as mergeable
      - does NOT GATE it - no CHANGES-REQUESTED, no fabricated blocker, no 'should-fix' presented as a merge-blocker. Noting a genuine minor observation (NaN propagation, more cases) while approving is fine — that's thoroughness, not over-gating. FAIL only if it blocks/withholds approval on sound code
