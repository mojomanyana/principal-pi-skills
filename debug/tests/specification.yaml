skill: debug

# Persona handed to the LLM judge so the checklist is read in context.
judge_persona: >
  a "debug" skill that diagnoses failures methodically (reproduce, hypothesize,
  fix the ROOT CAUSE not the symptom line, never swallow errors, add a
  regression test) — WITHOUT over-processing an obvious one-line bug.

ship_bar:
  total: 11
  min_pass: 10
  no_critical_fail: true
critical: [A1, A2, A3, C1, D1]

# Seeded scenarios copy the fixture dir into a temp git repo (file tools on), the
# agent fixes on disk, then `vitest run` + the captured git diff are graded. Most
# fixtures ship a RED test that the correct fix turns green. B1 is conversational
# → inline.

scenarios:
  - id: A1
    title: diagnose the cause (accumulator overwrite)
    critical: true
    mode: seeded
    fixture: fixtures/A1
    turns:
      - "The unit test in total.test.ts is red. Diagnose the cause in total.ts, then fix it."
    assert:
      vitest: true
    checklist:
      - names the root cause (the loop overwrites total instead of accumulating) as/before it fixes
      - the fix is correct (accumulate, e.g. total += n) and the test goes green; does not thrash with unexplained speculative edits

  - id: A2
    title: cause vs symptom (undefined from a missed lookup)
    critical: true
    mode: seeded
    fixture: fixtures/A2
    turns:
      - "greet(id) in greet.ts crashes with \"Cannot read properties of undefined (reading 'name')\" thrown inside formatUser (format.ts). Fix it."
    assert:
      vitest: true
    checklist:
      - traces the undefined to its ORIGIN — u is undefined because users.find() returns no match in greet() (the cause), not merely the throw site in formatUser
      - fixes or handles at the cause (the missing-user case in greet), not only a null-guard band-aid at the symptom line

  - id: A3
    title: don't swallow (gateway error crashes request)
    critical: true
    mode: seeded
    fixture: fixtures/A3
    turns:
      - "charge(order) in charge.ts sometimes throws and takes down the whole request. Make it stop crashing the server."
    assert:
      vitest: true
    checklist:
      - handles the GatewayError meaningfully (surface, retry, or mark the order failed) so the server doesn't crash and the failure is detectable
      - does NOT swallow it with a bare try/catch that hides the failure or leaves the order inconsistent

  # ── A3's governors. The swallow rule was written as "every catch logs AND changes
  # observable state", which is right at a service boundary and wrong everywhere else.
  # These three scenarios are the shapes it over-applied to: each is correct error handling
  # that the old rule would have called a swallow, so they fail if the rule is re-armed
  # without its limits.
  - id: A5
    title: "Pure parser — a typed error without logging is correct"
    turns:
      - "Our `parseDuration(input: string)` helper in a shared utils package throws a raw TypeError on malformed input and callers get a confusing stack. It's a pure function, no I/O, used by a CLI and by a server. Fix the error handling."
    checklist:
      - "keeps the failure observable to the caller — a typed/domain error (ParseError, InvalidDurationError) or a checked result (Result/Either/ok:false), whichever fits the codebase"
      - "does NOT require the pure helper to log, and does NOT invent a status field or persistence for it. A library that logs steals the caller's decision about where output goes; PASS if it explicitly leaves logging to the boundary. FAIL if it demands a log line or a markFailed inside the parser as a condition of the fix"

  - id: A6
    title: "Transaction — roll back and rethrow is complete"
    turns:
      - "transferFunds() opens a DB transaction, debits one account and credits another. When the credit fails, we get a partial transfer. Fix it."
    checklist:
      - "rolls back the transaction so no partial write survives, and lets the failure reach the caller (rethrow, or a checked failure result)"
      - "treats rollback + rethrow as sufficient — does NOT additionally demand a failed-status row or a marker record for a transaction that has been rolled back. There is no durable record left to mark; requiring one is the over-application this scenario exists to catch"

  - id: A7
    title: "Boundary logging — sanitized, and logged once"
    turns:
      - "Our HTTP handler catches upstream errors from the payments provider and does `log.error(err)` in the service, again in the repository, and again in the handler. The logs are enormous and support says they contain card numbers and the raw Authorization header. Fix it."
    checklist:
      - "logs ONCE, at the boundary that owns the error (the handler / job runner / entry point) rather than at every frame on the way up"
      - "sanitizes what is logged — no card numbers, no Authorization header or token, no raw request/response body or raw provider error dumped verbatim; operation, identifiers and error type are the right shape"
      - "does NOT respond by removing error handling altogether or by making the failure silent — the failure must still reach the caller"

  - id: A4
    title: diagnose the race (concurrent lost update)
    mode: seeded
    fixture: fixtures/A4
    turns:
      - "The test in worker.test.ts fails with a wrong (short) count — results go missing when the workers run concurrently. Fix the bug in worker.ts."
    assert:
      vitest: true
    checklist:
      - identifies the concurrency bug (a shared array written via a stale read across an await — a lost-update race), not a timing fluke to retry around
      - fixes the root cause (atomic append / collect-then-merge so no writes are lost), NOT a retry, a sleep, or a guess

  # ── Part B — multi-turn pressure (conversational) ──
  - id: B1
    title: knowing when to stop (flaky CI)
    turns:
      - "A flaky integration test fails about 30% of the time in CI but never on my machine. Help me fix it."
      - "I already tried adding sleeps and bumping the timeouts — still flaky."
      - "Still failing in CI. What now?"
    checklist:
      - by the final turn does NOT just suggest another sleep/timeout bump
      - proposes a real diagnostic (capture CI logs/artifacts, reproduce the CI environment, isolate the race, bisect) OR a structured stuck-summary with the one branching question
      - stays useful rather than thrashing

  # ── Part C — over-process governor ──
  - id: C1
    title: over-process governor (trivial one-liner)
    critical: true
    mode: seeded
    fixture: fixtures/C1
    turns:
      - "isEven in parity.ts returns the wrong thing — the test in parity.test.ts is red. It's a one-liner, just fix it."
    assert:
      vitest: true
    checklist:
      - just fixes the obvious one-liner (n % 2 === 0) so the test goes green
      - does NOT run a heavy reproduce/isolate/hypothesize ceremony on a trivial, obvious bug

  # ── Part D — the delegated (subagent) contract ──
  # agents/debug.md AS the system prompt, single-shot — the form used to keep a noisy
  # reproduction loop out of the parent context.
  - id: D1
    title: Single-shot nominal — note filled to where it verifiably got
    # This agent has the full toolset, so it may work across several messages — but a
    # delegating parent receives only the FINAL one. The note therefore has to be IN
    # that final message. The scenario is seeded (cart.ts + passing tests for non-empty
    # carts) so reproduction is one command away — an empty cwd made weak models
    # armchair-guess instead of reproducing.
    critical: true
    system_prompt_file: ../../agents/debug.md
    env:
      workspace: "fixture:fixtures/D1"
    turns:
      - "cartTotal in cart.ts throws on some carts in production — the trace says \"TypeError: Reduce of empty array with no initial value\" at cartTotal. Carts with items are fine (cart.test.ts passes). Diagnose it and fix it."
    checklist:
      - returns the debugging note template in ONE final message — Reproduction, Hypotheses tested, Root cause, Fix, Regression test — not scattered fragments
      - "reproduces the failure (an empty-cart call or failing test) and names the real root cause: reduce over the mapped array has no initial value, so an EMPTY cart throws instead of totalling 0"
      - "the fix is at the cause — an initial value (reduce(..., 0)) or equivalent — NOT a try/catch, a thrown-away special case at the call site, or a guard that hides the empty-cart case; existing tests stay green and a regression test covers the empty cart"
      - "states assumptions rather than asking the user anything — no question directed at the user"
  - id: D2
    title: Single-shot starved — NOT REPRODUCED, not a speculative fix
    system_prompt_file: ../../agents/debug.md
    turns:
      - "Checkout is broken in production sometimes. Fix it."
    checklist:
      - "returns the note with `Reproduction: NOT REPRODUCED` and names exactly what is missing (error text, logs, affected input, or steps)"
      - does NOT ship a speculative fix for a failure it cannot reproduce or locate
      - either asks the one question that would branch the search or names the instrumentation to capture it next time
